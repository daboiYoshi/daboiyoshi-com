<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Snake Arcade — daboiyoshi.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="rgba(57,255,20,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- glow ring -->
  <circle cx="950" cy="180" r="220" fill="rgba(57,255,20,0.08)"/>
  <circle cx="200" cy="500" r="180" fill="rgba(0,225,255,0.06)"/>

  <!-- pixel snake mark -->
  <g transform="translate(80,170)" fill="#39ff14">
    <rect x="0"  y="0"  width="40" height="40"/>
    <rect x="40" y="0"  width="40" height="40"/>
    <rect x="80" y="0"  width="40" height="40"/>
    <rect x="80" y="40" width="40" height="40"/>
    <rect x="80" y="80" width="40" height="40"/>
    <rect x="40" y="80" width="40" height="40"/>
    <rect x="0"  y="80" width="40" height="40"/>
    <rect x="0"  y="120" width="40" height="40"/>
    <rect x="0"  y="160" width="40" height="40"/>
    <rect x="40" y="160" width="40" height="40"/>
    <rect x="80" y="160" width="40" height="40"/>
    <rect x="120" y="160" width="40" height="40"/>
  </g>
  <rect x="280" y="200" width="24" height="24" fill="#00e1ff"/>

  <!-- text -->
  <g font-family="'Press Start 2P', 'Courier New', monospace" fill="#e6f1e0">
    <text x="80"  y="430" font-size="84" fill="#39ff14">SNAKE</text>
    <text x="80"  y="510" font-size="84">ARCADE</text>
  </g>
  <g font-family="'JetBrains Mono', 'Courier New', monospace" fill="#8a9a85">
    <text x="80" y="560" font-size="22">// browser games · tools · experiments</text>
    <text x="80" y="595" font-size="22" fill="#39ff14">www.daboiyoshi.com</text>
  </g>

  <!-- frame -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#1c2530" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="rgba(57,255,20,0.2)" stroke-width="1"/>
</svg>
